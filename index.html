<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Night Garden ✨</title>
  <style>
    :root {
      --sky-top: #0f1633;
      --sky-bottom: #241938;
      --text: #f5efff;
      --soft: rgba(255,255,255,.72);
      --glass: rgba(255,255,255,.08);
      --glass-border: rgba(255,255,255,.14);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
      color: var(--text);
    }

    body {
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      cursor: crosshair;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 100svh;
      isolation: isolate;
      overflow: hidden;
    }

    .sky {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 120%, rgba(133,92,183,.24), transparent 46%),
        linear-gradient(180deg, #0b1230 0%, #17132e 55%, #25183a 100%);
      transition: filter 2s ease, background 2s ease;
      z-index: -6;
    }

    .sky.bright {
      filter: brightness(1.12) saturate(1.08);
      background:
        radial-gradient(circle at 50% 105%, rgba(171,118,215,.26), transparent 46%),
        linear-gradient(180deg, #111942 0%, #221a42 55%, #39214c 100%);
    }

    #stars, #effects, #garden, #fireflies, #butterflies {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      box-shadow: 0 0 8px rgba(255,255,255,.55);
      animation: twinkle 3.5s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: .28; transform: scale(.8); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    .moon {
      position: absolute;
      top: 8%;
      right: 9%;
      width: 92px;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 36% 32%, rgba(255,255,255,.98), rgba(248,240,210,.95) 48%, rgba(220,210,188,.92) 68%, rgba(199,189,170,.9));
      box-shadow:
        0 0 30px rgba(255,244,194,.18),
        0 0 70px rgba(255,244,194,.12);
      opacity: .4;
      transform: translateY(-8px);
      transition: opacity 1.7s ease, box-shadow 1.7s ease, transform 1.7s ease;
      z-index: -2;
    }

    .moon.awake {
      opacity: .93;
      transform: translateY(0);
      box-shadow:
        0 0 35px rgba(255,244,194,.3),
        0 0 90px rgba(255,244,194,.18);
    }

    .intro {
      position: absolute;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 5;
      width: min(90vw, 620px);
      transition: opacity .8s ease, transform .8s ease;
    }

    .intro.hidden {
      opacity: 0;
      transform: translate(-50%, -54%);
      pointer-events: none;
    }

    .intro h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 54px);
      font-weight: 650;
      letter-spacing: -.03em;
      text-shadow: 0 0 28px rgba(210,185,255,.12);
    }

    .intro p {
      margin: 0;
      color: var(--soft);
      font-size: clamp(14px, 2.4vw, 18px);
    }

    .message {
      position: absolute;
      top: 11%;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      width: min(88vw, 720px);
      text-align: center;
      font-size: clamp(18px, 3vw, 30px);
      line-height: 1.35;
      opacity: 0;
      transition: opacity .7s ease, transform .7s ease;
      z-index: 10;
      text-shadow: 0 4px 22px rgba(0,0,0,.26);
      pointer-events: none;
    }

    .message.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .flower {
      position: absolute;
      width: 78px;
      height: 120px;
      transform-origin: bottom center;
      animation: grow .72s cubic-bezier(.2,.85,.2,1) forwards, sway 4s ease-in-out 1s infinite alternate;
      filter: drop-shadow(0 7px 9px rgba(0,0,0,.22));
    }

    .stem {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 5px;
      height: 72px;
      transform: translateX(-50%);
      border-radius: 8px;
      background: linear-gradient(#5fbf78, #2d7648);
    }

    .leaf {
      position: absolute;
      width: 28px;
      height: 14px;
      border-radius: 100% 0 100% 0;
      background: #4d9c61;
      bottom: 32px;
      left: 30px;
      transform: rotate(-18deg);
      transform-origin: left center;
    }

    .leaf.right {
      left: auto;
      right: 30px;
      transform: scaleX(-1) rotate(-18deg);
    }

    .bloom {
      position: absolute;
      top: 1px;
      left: 50%;
      width: 58px;
      height: 58px;
      transform: translateX(-50%);
    }

    .petal {
      position: absolute;
      width: 28px;
      height: 36px;
      left: 15px;
      top: 10px;
      border-radius: 70% 70% 54% 54%;
      transform-origin: 50% 80%;
      background: var(--petal);
      box-shadow: inset 0 -4px 8px rgba(0,0,0,.08);
    }

    .center {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffd978;
      left: 20px;
      top: 20px;
      box-shadow: 0 0 10px rgba(255,217,120,.45);
      z-index: 4;
    }

    @keyframes grow {
      0% { transform: translateY(36px) scale(.05); opacity: 0; }
      70% { transform: translateY(-3px) scale(1.06); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes sway {
      from { rotate: -1.8deg; }
      to { rotate: 1.8deg; }
    }

    .firefly {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff6a0;
      box-shadow: 0 0 10px 4px rgba(255,246,160,.42);
      animation: drift var(--d, 8s) ease-in-out infinite alternate;
      opacity: .78;
    }

    @keyframes drift {
      0% { transform: translate(0,0) scale(.85); opacity: .38; }
      45% { opacity: 1; }
      100% { transform: translate(var(--x, 70px), var(--y, -80px)) scale(1.15); opacity: .52; }
    }

    .butterfly {
      position: absolute;
      width: 24px;
      height: 16px;
      animation: butterflyFly 10s linear infinite;
      opacity: .78;
    }

    .butterfly::before,
    .butterfly::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 16px;
      top: 0;
      background: rgba(226,181,255,.82);
      border-radius: 75% 25% 75% 25%;
      transform-origin: right center;
      animation: flap .5s ease-in-out infinite alternate;
    }

    .butterfly::after {
      left: 12px;
      transform-origin: left center;
      border-radius: 25% 75% 25% 75%;
      animation-direction: alternate-reverse;
    }

    @keyframes flap {
      from { transform: rotateY(18deg) rotateZ(8deg); }
      to { transform: rotateY(72deg) rotateZ(-8deg); }
    }

    @keyframes butterflyFly {
      from { transform: translate(-10vw, 75vh) rotate(-7deg); }
      50% { transform: translate(45vw, 32vh) rotate(8deg); }
      to { transform: translate(110vw, 58vh) rotate(-4deg); }
    }

    .hold-ring {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 50%;
      transform: translate(-50%,-50%) scale(.2);
      opacity: 0;
      animation: ring .8s ease-out forwards;
      pointer-events: none;
    }

    @keyframes ring {
      0% { opacity: .8; transform: translate(-50%,-50%) scale(.2); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(4.4); }
    }

    .heart {
      position: absolute;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%) rotate(45deg);
      background: rgba(255,189,216,.9);
      animation: heartPop 1.6s ease-out forwards;
      pointer-events: none;
    }

    .heart::before, .heart::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: inherit;
    }
    .heart::before { left: -5px; }
    .heart::after { top: -5px; }

    @keyframes heartPop {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(45deg) scale(.2); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -90px) rotate(45deg) scale(1.25); }
    }

    .sky-button {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%) translateY(10px);
      padding: 13px 18px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: white;
      border-radius: 999px;
      font-size: 15px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 28px rgba(0,0,0,.16);
      opacity: 0;
      pointer-events: none;
      transition: opacity .6s ease, transform .6s ease, background .25s ease;
      z-index: 20;
      cursor: pointer;
    }

    .sky-button:hover { background: rgba(255,255,255,.13); }

    .sky-button.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .wish-scene {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #071023 0%, #0f1837 55%, #211a3f 100%);
      z-index: 100;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }

    .wish-scene.show {
      opacity: 1;
      pointer-events: auto;
    }

    .wish-card {
      width: min(90vw, 560px);
      text-align: center;
      padding: 30px 22px;
    }

    .wish-card h2 {
      font-size: clamp(28px, 5vw, 46px);
      margin: 0 0 10px;
      font-weight: 650;
      letter-spacing: -.03em;
    }

    .wish-card p {
      color: var(--soft);
      margin: 0 0 22px;
      line-height: 1.5;
    }

    .wish-card input {
      width: min(100%, 430px);
      padding: 15px 17px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.08);
      color: white;
      outline: none;
      font-size: 16px;
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    }

    .wish-card input::placeholder { color: rgba(255,255,255,.38); }

    .wish-card button {
      margin-top: 14px;
      border: 0;
      border-radius: 14px;
      padding: 13px 18px;
      background: rgba(255,255,255,.92);
      color: #15172c;
      font-weight: 650;
      cursor: pointer;
    }

    .wish-result {
      min-height: 56px;
      margin-top: 20px;
      font-size: 18px;
      line-height: 1.45;
      opacity: 0;
      transition: opacity .7s ease;
    }

    .wish-result.show { opacity: 1; }

    .shooting-star {
      position: absolute;
      top: 18%;
      left: -20%;
      width: 140px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, white);
      transform: rotate(-18deg);
      filter: drop-shadow(0 0 6px rgba(255,255,255,.85));
      animation: shoot 2.3s ease-in 1.1s forwards;
    }

    @keyframes shoot {
      from { transform: translate(0,0) rotate(-18deg); opacity: 0; }
      10% { opacity: 1; }
      to { transform: translate(145vw, 43vh) rotate(-18deg); opacity: 0; }
    }

    .hint {
      position: absolute;
      right: 16px;
      bottom: 14px;
      color: rgba(255,255,255,.35);
      font-size: 12px;
      opacity: 0;
      transition: opacity .6s ease;
      pointer-events: none;
      z-index: 12;
    }

    .hint.show { opacity: 1; }


    .final-surprise {
      margin: 24px auto 0;
      width: min(100%, 460px);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .8s ease, transform .8s ease;
    }

    .final-surprise.show {
      opacity: 1;
      transform: translateY(0);
    }

    .mini-gift {
      margin: 0 auto 18px;
      width: 82px;
      height: 82px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      font-size: 38px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.13);
      box-shadow: 0 12px 38px rgba(0,0,0,.18);
      animation: giftFloat 2.8s ease-in-out infinite;
    }

    @keyframes giftFloat {
      0%,100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    .final-line {
      font-size: clamp(17px, 4vw, 21px);
      line-height: 1.55;
      margin: 0;
    }

    .final-subline {
      margin-top: 10px;
      color: rgba(255,255,255,.62);
      font-size: 14px;
      line-height: 1.5;
    }

    .spark {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 10px rgba(255,255,255,.9);
      pointer-events: none;
      animation: sparkleOut 1.8s ease-out forwards;
    }

    @keyframes sparkleOut {
      0% { opacity: 0; transform: translate(0,0) scale(.4); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(1.1); }
    }

    .wish-note {
      margin-top: 10px;
      color: rgba(255,255,255,.42);
      font-size: 12px;
      line-height: 1.45;
    }

    @media (max-width: 640px) {
      .moon { width: 70px; right: 6%; top: 6%; }
      .intro { top: 42%; }
      .message { top: 9%; width: 90vw; }
      .flower { width: 68px; height: 108px; }
      .sky-button { bottom: max(5%, env(safe-area-inset-bottom)); }
      .hint { display: none; }
      .wish-card { padding: 24px 18px calc(24px + env(safe-area-inset-bottom)); }
      .wish-card input { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="sky" id="sky"></div>
    <div id="stars"></div>
    <div class="moon" id="moon"></div>
    <div id="garden"></div>
    <div id="fireflies"></div>
    <div id="butterflies"></div>
    <div id="effects"></div>

    <div class="intro" id="intro">
      <h1>Торкнись будь-де</h1>
      <p>І подивись, що станеться ✨</p>
    </div>

    <div class="message" id="message"></div>
    <div class="hint" id="hint">Затисни мишку на секунду ✨</div>

    <button class="sky-button" id="skyButton">Подивитись на небо ✨</button>

    <section class="wish-scene" id="wishScene">
      <div class="shooting-star"></div>
      <div class="wish-card">
        <h2>Загадай бажання ✨</h2>
        <p>Можеш написати його тут. Я нікому не скажу.</p>
        <input id="wishInput" type="text" maxlength="120" placeholder="Моє бажання..." />
        <br />
        <button id="wishButton">Загадати</button>
        <div class="wish-result" id="wishResult"></div>
        <div class="final-surprise" id="finalSurprise">
          <div class="mini-gift">🌷</div>
          <p class="final-line">А поки бажання шукає дорогу до здійснення — ця маленька квітка твоя.</p>
          <div class="final-subline">Можеш просто залишити її тут. Вона вже знає, кому належить 🙂</div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const garden = document.getElementById('garden');
    const firefliesLayer = document.getElementById('fireflies');
    const butterfliesLayer = document.getElementById('butterflies');
    const effects = document.getElementById('effects');
    const intro = document.getElementById('intro');
    const message = document.getElementById('message');
    const moon = document.getElementById('moon');
    const sky = document.getElementById('sky');
    const skyButton = document.getElementById('skyButton');
    const wishScene = document.getElementById('wishScene');
    const wishButton = document.getElementById('wishButton');
    const wishInput = document.getElementById('wishInput');
    const wishResult = document.getElementById('wishResult');
    const finalSurprise = document.getElementById('finalSurprise');
    const hint = document.getElementById('hint');

    let clicks = 0;
    let holdTimer = null;
    let holdStarted = false;
    let pointerX = 0;
    let pointerY = 0;
    let messageTimer = null;

    const flowerColors = [
      '#f59bbb', '#ffcf78', '#bfa5ff', '#8ed5ff', '#f6f2ff',
      '#ff9c8f', '#d9a3ff', '#f3b4d4', '#a4e3c1'
    ];

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createStars() {
      const stars = document.getElementById('stars');
      const count = window.innerWidth < 700 ? 65 : 110;
      for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = rand(0, 100) + '%';
        s.style.top = rand(0, 72) + '%';
        const size = rand(1, 2.8);
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.animationDelay = rand(0, 3.5) + 's';
        s.style.animationDuration = rand(2.3, 4.5) + 's';
        stars.appendChild(s);
      }
    }

    function flowerHTML(color) {
      const angles = [0, 60, 120, 180, 240, 300];
      return `
        <div class="stem"></div>
        <div class="leaf"></div>
        <div class="leaf right"></div>
        <div class="bloom">
          ${angles.map(a => `<div class="petal" style="--petal:${color}; transform: rotate(${a}deg) translateY(-13px);"></div>`).join('')}
          <div class="center"></div>
        </div>
      `;
    }

    function createFlower(x, y) {
      const flower = document.createElement('div');
      flower.className = 'flower';
      const color = flowerColors[Math.floor(Math.random() * flowerColors.length)];
      flower.innerHTML = flowerHTML(color);

      const maxX = window.innerWidth - 80;
      const maxY = window.innerHeight - 125;

      flower.style.left = Math.max(0, Math.min(x - 39, maxX)) + 'px';
      flower.style.top = Math.max(window.innerHeight * .32, Math.min(y - 78, maxY)) + 'px';
      flower.style.scale = rand(.74, 1.08).toFixed(2);
      flower.style.animationDelay = '0s,' + rand(.6, 2.2).toFixed(2) + 's';
      garden.appendChild(flower);
    }

    function createFirefly(count = 1, aroundX = null, aroundY = null) {
      for (let i = 0; i < count; i++) {
        const f = document.createElement('div');
        f.className = 'firefly';
        const left = aroundX === null ? rand(6, 94) * window.innerWidth / 100 : aroundX + rand(-70, 70);
        const top = aroundY === null ? rand(25, 88) * window.innerHeight / 100 : aroundY + rand(-50, 50);
        f.style.left = left + 'px';
        f.style.top = top + 'px';
        f.style.setProperty('--x', rand(-90, 90) + 'px');
        f.style.setProperty('--y', rand(-110, 60) + 'px');
        f.style.setProperty('--d', rand(4.8, 9.2) + 's');
        firefliesLayer.appendChild(f);
      }
    }

    function createButterfly() {
      const b = document.createElement('div');
      b.className = 'butterfly';
      b.style.top = rand(20, 70) + '%';
      b.style.animationDelay = (-rand(0, 7)) + 's';
      b.style.animationDuration = rand(8, 13) + 's';
      butterfliesLayer.appendChild(b);
    }

    function showMessage(text, duration = 3000) {
      clearTimeout(messageTimer);
      message.textContent = text;
      message.classList.add('show');
      messageTimer = setTimeout(() => message.classList.remove('show'), duration);
    }

    function progress() {
      if (clicks === 1) {
        intro.classList.add('hidden');
      }
      if (clicks === 5) {
        createFirefly(6);
      }
      if (clicks === 8) {
        showMessage('Тут уже стає трохи живіше.');
      }
      if (clicks === 10) {
        moon.classList.add('awake');
        sky.classList.add('bright');
        createFirefly(7);
      }
      if (clicks === 13) {
        createButterfly();
        hint.classList.add('show');
      }
      if (clicks === 16) {
        createButterfly();
        createFirefly(8);
        showMessage('Дивно, як деякі речі стають красивішими від одного дотику.', 4200);
      }
      if (clicks === 21) {
        showMessage('Мабуть, з людьми інколи так само.', 4200);
      }
      if (clicks === 24) {
        skyButton.classList.add('show');
      }
    }

    let lastTapAt = 0;

    function plantAt(x, y) {
      clicks++;
      createFlower(x, y);
      progress();
    }

    function createHoldEffect(x, y) {
      createFirefly(8, x, y);

      const ring = document.createElement('div');
      ring.className = 'hold-ring';
      ring.style.left = x + 'px';
      ring.style.top = y + 'px';
      effects.appendChild(ring);
      setTimeout(() => ring.remove(), 900);

      for (let i = 0; i < 7; i++) {
        const h = document.createElement('div');
        h.className = 'heart';
        h.style.left = (x + rand(-32, 32)) + 'px';
        h.style.top = (y + rand(-22, 24)) + 'px';
        h.style.animationDelay = (i * .05) + 's';
        effects.appendChild(h);
        setTimeout(() => h.remove(), 1800);
      }
    }

    // Desktop / modern mobile tap
    document.addEventListener('click', (e) => {
      if (e.target.closest('button, input')) return;
      if (Date.now() - lastTapAt < 350) return;
      plantAt(e.clientX, e.clientY);
    });

    // Mobile long-press
    document.addEventListener('touchstart', (e) => {
      if (e.target.closest('button, input')) return;
      if (!e.touches[0]) return;

      pointerX = e.touches[0].clientX;
      pointerY = e.touches[0].clientY;
      holdStarted = false;

      holdTimer = setTimeout(() => {
        holdStarted = true;
        createHoldEffect(pointerX, pointerY);
      }, 650);
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (!e.touches[0]) return;
      pointerX = e.touches[0].clientX;
      pointerY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      clearTimeout(holdTimer);
      if (holdStarted) {
        lastTapAt = Date.now();
      }
    }, { passive: true });

    // Desktop long-press
    document.addEventListener('mousedown', (e) => {
      if (e.target.closest('button, input')) return;
      pointerX = e.clientX;
      pointerY = e.clientY;
      holdStarted = false;

      holdTimer = setTimeout(() => {
        holdStarted = true;
        createHoldEffect(pointerX, pointerY);
      }, 650);
    });

    document.addEventListener('mouseup', () => {
      clearTimeout(holdTimer);
      if (holdStarted) lastTapAt = Date.now();
    });

    skyButton.addEventListener('click', (e) => {
      e.stopPropagation();
      wishScene.classList.add('show');
      setTimeout(() => wishInput.focus(), 1200);
    });

    function burstSparkles() {
      const rect = wishResult.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + 20;
      for (let i = 0; i < 22; i++) {
        const s = document.createElement('div');
        s.className = 'spark';
        s.style.left = cx + 'px';
        s.style.top = cy + 'px';
        s.style.setProperty('--sx', rand(-170, 170) + 'px');
        s.style.setProperty('--sy', rand(-120, 120) + 'px');
        effects.appendChild(s);
        setTimeout(() => s.remove(), 1900);
      }
    }

    wishButton.addEventListener('click', (e) => {
      e.stopPropagation();
      const wish = wishInput.value.trim();
      wishInput.blur();
      wishButton.disabled = true;
      wishButton.textContent = 'Відправляю...';

      // The wish remains only on this device unless a private endpoint is configured.
      if (wish) {
        try {
          localStorage.setItem('nightGardenWish', wish);
          localStorage.setItem('nightGardenWishTime', new Date().toISOString());
        } catch (_) {}
      }

      setTimeout(() => {
        wishResult.innerHTML = `
          <strong style="font-size:22px">✨ Бажання прийнято.</strong><br><br>
          <span style="font-size:15px; color:rgba(255,255,255,.66)">
            ${wish ? 'Тепер воно офіційно десь між тобою, нічним небом і маленькою удачею.' : 'Навіть якщо ти його не написала — я все одно вважаю, що воно було.'}
          </span>
        `;
        wishResult.classList.add('show');
        burstSparkles();
        wishButton.style.display = 'none';
        wishInput.style.display = 'none';

        setTimeout(() => {
          wishResult.innerHTML += `
            <br><br>
            <span style="font-size:16px">
              І якщо воно було про людину, яка надіслала тобі це посилання —
              у цього бажання підозріло хороші шанси 🙂
            </span>
            <div class="wish-note">P.S. бажання залишається секретом на цьому пристрої.</div>
          `;
        }, 1800);

        setTimeout(() => {
          finalSurprise.classList.add('show');
        }, 3200);
      }, 1100);
    });

    wishInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') wishButton.click();
    });

    createStars();
  </script>
</body>
</html>
